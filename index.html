<!doctype html>
<html><head><meta charset="utf-8"><title>Farm Sim</title>
<style>
body{margin:0;font:16px system-ui;background:#2f4a22;color:#f3f7e8;display:grid;place-items:center;height:100vh}
#world{width:480px;height:270px;background:#6fae4a;border-radius:8px;position:relative;overflow:hidden}
#night{position:absolute;inset:0;background:#0b1430;opacity:0;pointer-events:none}
#hud{position:absolute;top:8px;right:8px;background:#0008;padding:8px 12px;border-radius:6px;text-align:right}
#bar{width:120px;height:8px;background:#0006;border-radius:4px;margin-top:6px}
#bar i{display:block;height:100%;background:#ffd84a;border-radius:4px}
#msg{position:absolute;bottom:8px;left:8px}
.row{margin-top:12px;display:flex;gap:8px}
</style></head><body>
<div>
  <div id="world"><div id="night"></div>
    <div id="hud"><div id="date"></div><div id="time"></div><div id="bar"><i></i></div></div>
    <div id="msg"></div></div>
  <div class="row">
    <button id="swing">Swing hoe (-1 energy)</button>
    <button id="sleep">Sleep</button>
    <button id="fast">Speed: 1x</button>
  </div>
</div>
<script type="module">
import { Clock, MAX_ENERGY } from './src/clock.js';
const clock = new Clock();
const $ = id => document.getElementById(id);
const say = t => $('msg').textContent = t;

clock.on('overnight', () => say('Overnight update runs here (crops grow, bin pays out).'))
     .on('newDay', ({ passedOut }) => passedOut && say('You passed out at 2 AM. Half energy today.'))
     .on('season', c => say(`Welcome to ${c.seasonName}!`));

$('swing').onclick = () => { if (!clock.useEnergy(1)) say('Too tired. Go to bed.'); };
$('sleep').onclick = () => clock.sleep();
const speeds = [1, 10, 100]; let s = 0;
$('fast').onclick = () => { s = (s + 1) % speeds.length; clock.msPerTick = 7000 / speeds[s]; $('fast').textContent = `Speed: ${speeds[s]}x`; };

let last = performance.now();
function frame(now) {
  clock.update(now - last); last = now;
  $('date').textContent = `${clock.seasonName} ${clock.day}, Year ${clock.year}`;
  $('time').textContent = clock.timeString;
  $('bar').firstChild.style.width = clock.energy / MAX_ENERGY * 100 + '%';
  $('night').style.opacity = Math.max(0, clock.dayProgress - 0.6) * 1.5;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
