<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FarmLife Map Editor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500&display=swap">
<style>
  :root { --bg: #2f4a22; --panel: #3f2631; --panel2: #57394a; --line: #6e4b5e; --text: #fff8e8; --dim: #d8c6b8; --accent: #e86a9a; --ok: #7cc35a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px "Pixelify Sans", system-ui, sans-serif; }
  body { display: grid; grid-template: auto 1fr auto / 260px 1fr; height: 100vh; overflow: hidden; }
  header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 2px solid #241318; }
  header h1 { font-size: 18px; margin: 0 10px 0 0; font-weight: 500; }
  .sep { width: 2px; align-self: stretch; background: var(--line); margin: 0 4px; }
  button, select, input { font: inherit; color: var(--text); background: var(--panel2); border: 2px solid var(--line); border-radius: 6px; padding: 4px 9px; }
  button { cursor: pointer; } button:hover { border-color: var(--dim); }
  button.on { background: var(--accent); border-color: #fff8e8; }
  input[type=number] { width: 58px; }
  aside { background: var(--panel); overflow-y: auto; padding: 10px; border-right: 2px solid #241318; }
  aside h2 { font-size: 13px; font-weight: 500; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; margin: 14px 0 6px; }
  aside h2:first-child { margin-top: 0; }
  .tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .tools button { padding: 5px 2px; font-size: 13px; }
  .opts { margin-top: 6px; font-size: 13px; color: var(--dim); min-height: 1.4em; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .brush { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 2px; background: var(--panel2); border: 2px solid transparent; border-radius: 6px; cursor: pointer; font-size: 11px; text-align: center; line-height: 1.1; }
  .brush:hover { border-color: var(--line); }
  .brush.on { border-color: var(--accent); background: #6e3d55; }
  .brush canvas { width: 56px; height: 56px; image-rendering: pixelated; }
  main { position: relative; overflow: hidden; }
  .zoom { position: absolute; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--panel); border: 2px solid #241318; border-radius: 8px; }
  .zoom input[type=range] { width: 130px; accent-color: var(--accent); padding: 0; border: 0; background: none; }
  .zoom output { min-width: 46px; text-align: center; }
  .zoom button { padding: 2px 8px; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  footer { grid-column: 1 / -1; padding: 4px 12px; background: var(--panel); color: var(--dim); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; border-top: 2px solid #241318; }
  footer b { color: var(--text); font-weight: 500; }
  @media (max-width: 700px) {
    .zoom input[type=range] { width: 70px; }
    body { grid-template: auto 1fr 190px auto / 1fr; }
    aside { grid-row: 3; border-right: 0; border-top: 2px solid #241318; }
    .grid { grid-template-columns: repeat(5, 1fr); }
  }
</style>
</head>
<body>
<header>
  <h1>Map Editor</h1>
  <button id="new" title="Start an empty grass map">New</button>
  <button id="farm" title="Open the current farm map to change it">Open farm</button>
  <button id="import" title="Open a map .json file">Import</button>
  <button id="export" title="Download this map as a .json file">Export</button>
  <button id="play" title="Play this map in the game (new tab)">▶ Play test</button>
  <span class="sep"></span>
  <button id="undo" title="Undo (Ctrl+Z)">↶</button>
  <button id="redo" title="Redo (Ctrl+Y)">↷</button>
  <span class="sep"></span>
  <button id="gridT" class="on" title="Grid (G)">Grid</button>
  <button id="solidT" title="Show what blocks walking (V)">Collision</button>
  <span class="sep"></span>
  <label>Size <input id="mw" type="number" min="8" max="200"> × <input id="mh" type="number" min="8" max="200"></label>
  <button id="resize">Resize</button>
  <input id="file" type="file" accept=".json,application/json" hidden>
</header>
<aside>
  <h2>Tools</h2>
  <div class="tools" id="tools"></div>
  <div class="opts" id="opts"></div>
  <div id="palette"></div>
</aside>
<main><canvas id="map"></canvas>
  <div class="zoom" title="Zoom: mouse wheel or pinch on the map, + / - keys, 0 to fit">
    <button id="zout" title="Zoom out (-)">−</button>
    <input id="zslide" type="range" min="0" max="1000" aria-label="Zoom">
    <button id="zin" title="Zoom in (+)">+</button>
    <output id="zpct">100%</output>
    <button id="zfit" title="Fit the whole map (0)">Fit</button>
    <button id="z100" title="Actual size (1)">1:1</button>
  </div>
</main>
<footer><span id="pos">–</span><span id="info"></span><span id="hint"></span></footer>
<script type="module" src="src/editor.js"></script>
</body>
</html>
